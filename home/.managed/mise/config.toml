# Python CLIs: the pipx backend shells out to uv, so extras land in the tool's own venv.
"pipx:comfy-cli" = "latest"
"pipx:fonttools" = { version = "latest", extras = ["woff"] }
"pipx:frida-tools" = "latest"
"pipx:mitmproxy" = "latest"
"pipx:vastai" = "latest"
"pipx:voice-mode" = "latest"
"pipx:ya-frida-mcp" = "latest"
"pipx:yt-dlp" = { version = "latest", extras = ["default", "secretstorage"] }
"npm:@xevion/tempo" = "latest"
gitleaks = "latest"
trufflehog = "latest"
kubectl = "latest"
"npm:cline" = "latest"

# Git-sourced Python CLIs stay on uv; mise's pipx backend resolves these as GitHub
# release slugs and 404s. Reinstall with:
#   uv tool install git+https://github.com/oraios/serena
#   uv tool install git+https://github.com/matus-chochlik/ctcache.git@0c7fee26e09ae8a393ed7d56164102da118ab23a

