# BEGIN_KITTY_THEME
# Dark Pride
include current-theme.conf
# END_KITTY_THEME

enable_audio_bell no
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}
font_family GeistMono Nerd Font
font_size 9.5

# change gamma adjustment for dark text on light backgrounds (thicker, smoother)
text_composition_strategy 1.9 0

# Enable ligatures explicitly
disable_ligatures never

window_padding_width 3

# splits gives tmux-style directional panes; stack makes ctrl+shift+l a zoom toggle
enabled_layouts splits,stack

# Disable command finish notifications (fixes cryptic "4;0;0" notifications)
notify_on_cmd_finish never

# Font size adjustments (default step is 2.0, reduced to 1.0 for finer control)
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Claude Code: Enable Shift+Enter for multi-line prompts
map shift+enter send_text all \n

# Copy last command output directly to clipboard
map ctrl+shift+o launch --stdin-source=@last_cmd_output --type=overlay bash -c "xclip -selection clipboard && echo 'Copied last command output to clipboard!'"

# Copy visible screen content to clipboard (works in any window including overlays)
map ctrl+shift+y launch --allow-remote-control --type=background bash -c "kitten @ get-text --match state:focused --extent screen | xclip -selection clipboard"

# Open last command output in Neovim for easy selection (starts in visual line mode)
map ctrl+shift+g launch --stdin-source=@last_cmd_output --type=overlay nvim -u NONE -c "luafile ~/.config/kitty/buffer-select.lua" -

# Open full scrollback in Neovim for easy selection (starts in visual line mode)
map ctrl+shift+f launch --stdin-source=@screen_scrollback --type=overlay nvim -u NONE -c "luafile ~/.config/kitty/buffer-select.lua" -

# Restore move_window_forward (default ctrl+shift+f, freed above)
map ctrl+alt+f move_window_forward

# Move current window to another tab interactively
map ctrl+shift+m detach_window ask

# Move current window to a new tab
map ctrl+shift+n detach_window new-tab

# Duplicate terminal in new tab with current working directory
map ctrl+shift+s launch --cwd=oldest --type=tab --location=after

# Duplicate terminal as split/window with current working directory
map ctrl+shift+alt+s launch --cwd=oldest

# Splits with an explicit axis (default ctrl+shift+enter lets kitty choose)
map ctrl+shift+enter     launch --location=vsplit --cwd=current
map ctrl+shift+alt+enter launch --location=hsplit --cwd=current

# Flip an existing split between side-by-side and stacked
map ctrl+alt+r layout_action rotate

# Directional focus between splits
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down

# Directional move of the focused split
map ctrl+shift+alt+left  move_window left
map ctrl+shift+alt+right move_window right
map ctrl+shift+alt+up    move_window up
map ctrl+shift+alt+down  move_window down

# Persistent scratch pad (tmux session with micro)
# On ctrl+alt+p so ctrl+shift+p stays free for kitty's builtin hints chords
# (p>f insert path, p>shift+f open path, p>n open at line, p>l/w/h/y)
map ctrl+alt+p launch --type=overlay scratch

# Run Claude usage checker
map ctrl+alt+c launch --type=overlay fish -c "claude-usage; read -P 'Press any key to close...'"

# Open lazygit in current working directory
map ctrl+alt+l launch --cwd=oldest --type=overlay fish -c lazygit

# Path pickers: both find the same paths via screen_paths.py, then hand the one
# you choose to an action menu (open, reveal in file manager, copy, edit).

# Label paths in place, type a label to pick one
map ctrl+shift+d kitten hints --customize-processing screen_paths.py --type path --program "launch --type=overlay --cwd=current kitty-paths action"

# List every path on screen in fzf, fuzzy-filter to pick one
map ctrl+shift+space launch --type=overlay --cwd=current --stdin-source=@screen --stdin-add-line-wrap-markers kitty-paths list
