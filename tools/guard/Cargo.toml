[package]
name = "guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Transparent pipeline capture for Claude Code's Bash tool"

[[bin]]
name = "guard"
path = "src/main.rs"

[lib]
name = "guard"
path = "src/lib.rs"

[dependencies]
brush-parser = "0.4"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"
globset = "0.4.19"
jiff = "0.2.35"
tree-sitter = "0.26"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-sequel = "0.3.11"
regex = "1.13.1"
ignore = "0.4.30"

[lints.clippy]
disallowed_macros = "deny"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
assert2 = "0.4.0"
proptest = "1.11.0"
rstest = "0.26.1"
