// Autoconfig skips the first line of this file.

// Values set with pref() are reapplied on every startup, overriding UI changes.
pref("sidebar.revamp", true);
pref("sidebar.visibility", "always-show");
// Linux opens the context menu on mousedown, which would fire before a right-button wheel gesture.
pref("ui.context_menus.after_mouseup", true);
// Developer Edition honors this, so self-built extensions install without AMO signing.
pref("xpinstall.signatures.required", false);

try {
  const dir = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
  dir.append("autoconfig");
  Services.io
    .getProtocolHandler("resource")
    .QueryInterface(Components.interfaces.nsIResProtocolHandler)
    .setSubstitution("userconfig", Services.io.newFileURI(dir));

  ChromeUtils.registerWindowActor("WheelTab", {
    parent: { esModuleURI: "resource://userconfig/WheelTabParent.sys.mjs" },
    child: {
      esModuleURI: "resource://userconfig/WheelTabChild.sys.mjs",
      events: {
        mousedown: { capture: true },
        wheel: { capture: true, passive: false },
        contextmenu: { capture: true },
      },
    },
    allFrames: true,
    // Without this, web-content processes refuse the actor. The parent only switches tabs.
    safeForUntrustedWebProcess: true,
  });
} catch (e) {
  console.error("mozilla.cfg:", e);
}
