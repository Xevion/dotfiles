[package]
name = "subagent-log"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
owo-colors = "4.4.0"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snafu = "0.9.2"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
tui-markdown = "0.3.9"

[dev-dependencies]
assert2 = "0.4.1"
rstest = "0.26.1"
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
